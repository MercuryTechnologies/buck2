# Fork-local cargo-nextest configuration.
#
# This file does not exist upstream, so changes here survive a rebase onto
# facebook/buck2 untouched. Prefer it over patching test sources.

[profile.default]
# nextest will wait on a hung test forever; one did, and burned 45 minutes of a
# CI job before the job itself died. Warn every 60s, then kill and fail the test
# after five such periods. No unit test in this workspace legitimately runs for
# five minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

# Disabled in this fork: hangs forever on the GitHub Actions Linux runner.
#
# `try_terminate_process_gracefully` escalates to SIGKILL and then polls
# `kill(pid, 0)` with *no* timeout, so it spins for eternity against a process
# that has exited but not yet been reaped. The test orphans `sh child.sh` on
# purpose, expecting init to reap it promptly; on the Actions Linux runner the
# orphan reparents to the runner worker instead, which does not reap until job
# cleanup, so the poll never sees ESRCH. The test's own comment anticipates
# exactly this ("it will enter a zombie state ... and termination would be
# stuck").
#
# Passes on macOS, and its sibling test_sigkill_when_graceful_termination_fails
# passes on both, so the coverage lost here is small.
default-filter = 'not (package(buck2_common) and test(=kill_util::tests::test_graceful_termination))'
