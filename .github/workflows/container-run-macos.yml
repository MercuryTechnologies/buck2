name: container_run on macOS
on:
  push:
    branches:
      - container-run
    paths:
      - prelude/container/**
      - prelude/toolchains/container.bzl
      - prelude/toolchains/demo.bzl
      - examples/with_prelude/container_run/**
      - .github/workflows/container-run-macos.yml
  pull_request:
    paths:
      - prelude/container/**
      - prelude/toolchains/container.bzl
      - prelude/toolchains/demo.bzl
      - examples/with_prelude/container_run/**
      - .github/workflows/container-run-macos.yml
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

jobs:
  # Exercises `container_run` (prelude/container) on a real Mac with Apple's
  # `container` CLI. GitHub's macOS runners are VMs, which may not be able to
  # start the CLI's own Linux VMs; the last step then still checks that the CLI
  # accepts the command line the launcher builds.
  container-run-macos:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v6
    - name: Test the launcher with macOS's /bin/sh
      run: sh examples/with_prelude/container_run/test_container_run.sh
    - name: Install buck2
      run: |
        command -v zstd >/dev/null || brew install zstd
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL -o "$RUNNER_TEMP/buck2.zst" \
          https://github.com/facebook/buck2/releases/download/latest/buck2-aarch64-apple-darwin.zst
        zstd -d "$RUNNER_TEMP/buck2.zst" -o "$RUNNER_TEMP/bin/buck2"
        chmod +x "$RUNNER_TEMP/bin/buck2"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: Set up a project using this prelude
      run: |
        p="$RUNNER_TEMP/project"
        mkdir -p "$p/toolchains" "$p/none" "$p/platforms"
        cp -R prelude "$p/prelude"
        cp -R examples/with_prelude/container_run examples/with_prelude/test_utils.bzl "$p/"
        touch "$p/.buckroot" "$p/none/BUCK"
        cat > "$p/.buckconfig" <<'EOF'
        [cells]
        root = .
        prelude = prelude
        toolchains = toolchains
        none = none

        [cell_aliases]
        config = prelude
        ovr_config = prelude
        fbcode = none
        fbsource = none
        buck = none

        [parser]
        target_platform_detector_spec = target:root//...->prelude//platforms:default

        [build]
        execution_platforms = prelude//platforms:default
        EOF
        cat > "$p/toolchains/BUCK" <<'EOF'
        load("@prelude//toolchains:demo.bzl", "system_demo_toolchains")

        system_demo_toolchains()
        EOF
        cat > "$p/platforms/BUCK" <<'EOF'
        platform(
            name = "linux-arm64",
            constraint_values = [
                "config//os/constraints:os[linux]",
                "config//cpu/constraints:cpu[arm64]",
            ],
        )
        EOF
    - name: Build and test the example
      working-directory: ${{ runner.temp }}/project
      run: |
        buck2 --version
        buck2 build //container_run/...
        buck2 test //container_run/...
    - name: Install Apple's container CLI
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sw_vers
        gh release download --repo apple/container --pattern '*.pkg' --dir "$RUNNER_TEMP/pkg"
        ls "$RUNNER_TEMP/pkg"
        pkg=$(ls "$RUNNER_TEMP"/pkg/*signed*.pkg 2>/dev/null | head -1)
        [ -n "$pkg" ] || pkg=$(ls "$RUNNER_TEMP"/pkg/*.pkg | head -1)
        sudo installer -pkg "$pkg" -target /
        container system version || container --version
    - name: Start the container services
      continue-on-error: true
      run: container system start --enable-kernel-install
    - name: Check whether this runner can run containers
      id: probe
      continue-on-error: true
      run: |
        # Hosted macOS runners are VMs; containers need a hypervisor.
        echo "chip: $(sysctl -n machdep.cpu.brand_string)"
        echo "model: $(sysctl -n hw.model)"
        echo "hypervisor available (kern.hv_support): $(sysctl -n kern.hv_support)"
        container run --rm docker.io/library/alpine:3 uname -a
    - name: buck2 run a Linux target through the container CLI
      working-directory: ${{ runner.temp }}/project
      env:
        CAN_RUN: ${{ steps.probe.outcome == 'success' }}
        BUCK_CONTAINER_RUN_VERBOSE: "1"
      run: |
        set +e
        out=$(buck2 run --target-platforms root//platforms:linux-arm64 //container_run:hello </dev/null 2>&1)
        rc=$?
        set -e
        printf '%s\n' "$out"
        echo "exit code: $rc"
        if [ "$CAN_RUN" = true ]; then
          case $out in
            *"hello from Linux, via launcher: yes"*) echo "OK: ran in a Linux container" ;;
            *) echo "FAIL: expected the program to run in a Linux container"; exit 1 ;;
          esac
        else
          # No nested virtualization here. The CLI parses its arguments before
          # it starts anything and exits 64 on a usage error.
          case $out in
            *"container_run: running:"*) ;;
            *) echo "FAIL: the launcher did not reach the container CLI"; exit 1 ;;
          esac
          if [ "$rc" = 64 ]; then
            echo "FAIL: the container CLI rejected the launcher's arguments"
            exit 1
          fi
          echo "OK: the container CLI accepted the arguments (this runner cannot start VMs)"
        fi
